<style>
/* Layout: app shell — sticky header + scrollable tab strip, one working column (max 1080px), sheets slide up for forms */
:root{

  --accent:#1D6A4D; --accent-ink:#FFFFFF; --accent-soft:#DDEEE5;
  --wood:#8B5A2B; --wood-soft:#F3E6D6;
  --good:#2C7A4B; --good-soft:#DFF1E5; --warn:#A86A12; --warn-soft:#FBEED3; --bad:#B42318; --bad-soft:#FBE3E0;
  --shadow:0 10px 30px rgba(20,40,30,.14);
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1512; --surface:#161E19; --sunk:#1C2620; --ink:#E4ECE6; --muted:#98A69D; --line:#2A362F;
  --accent:#5DBE90; --accent-ink:#0C1A13; --accent-soft:#1B3328;
  --wood:#D19A62; --wood-soft:#33261A;
  --good:#63C48C; --good-soft:#18301F; --warn:#E3AB4E; --warn-soft:#352914; --bad:#F27C6F; --bad-soft:#3A1C19;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#161E19; --sunk:#1C2620; --ink:#E4ECE6; --muted:#98A69D; --line:#2A362F;
  --accent:#5DBE90; --accent-ink:#0C1A13; --accent-soft:#1B3328;
  --wood:#D19A62; --wood-soft:#33261A;
  --good:#63C48C; --good-soft:#18301F; --warn:#E3AB4E; --warn-soft:#352914; --bad:#F27C6F; --bad-soft:#3A1C19;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.86em;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.84rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{max-width:1080px;margin:0 auto;padding-block:12px 6px;padding-inline:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand-mark{width:30px;height:30px;flex:none}
.brand h1{font-size:1.1rem;font-weight:700}
.brand .sub{font-size:.78rem;color:var(--muted)}
.tabs{max-width:1080px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding-inline:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 10px 11px;font-weight:600;font-size:.9rem;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .count{font-family:var(--f-mono);font-size:.72rem;background:var(--bad-soft);color:var(--bad);border-radius:99px;padding:0 6px}

main{max-width:1080px;margin:0 auto;padding-block:18px 80px;padding-inline:16px;display:grid;gap:18px}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--sunk);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:.84rem;color:var(--muted)}
.banner b{color:var(--ink)}
.view-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.view-head p{color:var(--muted);font-size:.9rem;max-width:62ch;margin-top:4px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:.9rem;cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent);padding-inline:6px}
.btn.small{padding:5px 10px;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.panel-pad{padding:16px}
.grid{display:grid;gap:12px}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:grid;gap:6px;min-width:0}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:.76rem;font-weight:600;white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--sunk);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:1px 7px;font-size:.74rem;font-weight:600;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.logs{background:var(--wood-soft);color:var(--wood);border-color:transparent}
.chip.sawn{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.ok{color:var(--good);border-color:var(--good-soft);background:var(--good-soft)}
.chip.miss{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}

.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:2px}
.kpi .v{font-family:var(--f-display);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .v small{font-size:.9rem;font-weight:500;color:var(--muted);margin-left:3px}
.kpi .l{font-size:.8rem;color:var(--muted)}
.kpi.alert .v{color:var(--bad)}

.ledger{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.ledger span{display:block;height:100%}
.ledger .used{background:var(--muted);opacity:.55}
.ledger .left{background:var(--accent)}
.ledger.logs .left{background:var(--wood)}

.flow{display:grid;gap:10px}
.flow-row{display:grid;grid-template-columns:minmax(0,9.5rem) 1fr 4.5rem;gap:10px;align-items:center;font-size:.86rem}
.flow-bar{height:18px;border-radius:5px;background:var(--wood)}
.flow-bar.sawn{background:var(--accent)}
.flow-bar.out{background:var(--ink);opacity:.75}
.flow-row .val{text-align:right;font-family:var(--f-mono);font-size:.82rem}
.flow-note{font-size:.8rem;color:var(--muted);padding-left:calc(9.5rem + 10px)}

.list{display:grid}
.li{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.sev{width:4px;align-self:stretch;border-radius:4px;flex:none}
.sev.bad{background:var(--bad)} .sev.warn{background:var(--warn)} .sev.good{background:var(--good)}

.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{text-align:left;font-weight:600;color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
td.r,th.r{text-align:right}

.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:min(760px,100%);max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;box-shadow:var(--shadow);padding-block:0 calc(20px + env(safe-area-inset-bottom,0px));padding-inline:0}
@media (min-width:800px){.scrim{align-items:center}.sheet{border-radius:16px;max-height:88%}}
.sheet-head{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line);z-index:2}
.sheet-body{padding:16px 18px;display:grid;gap:16px}
.x{border:0;background:var(--sunk);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1.1rem;line-height:1}

.form{display:grid;gap:12px}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
label.f{display:grid;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-weight:400;font-size:.92rem;color:var(--ink);width:100%;min-width:0}
label.f textarea{font-family:var(--f-mono);font-size:.82rem;min-height:92px}
label.f .hint{font-weight:400;font-size:.76rem}
.tag{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;border-radius:4px;padding:0 5px;margin-left:4px}
.tag.scan{background:var(--accent-soft);color:var(--accent)}
.tag.typed{background:var(--warn-soft);color:var(--warn)}
.fieldset{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);display:grid;gap:12px}
.fieldset legend,.fs-title{font-family:var(--f-display);font-weight:600;font-size:.95rem}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.step.on{background:var(--ink);color:var(--bg)}
.step.done{background:var(--accent-soft);color:var(--accent)}
.checks{display:grid;gap:6px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;font-size:.88rem;background:var(--surface);border:1px solid var(--line)}
.check .ic{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700}
.check.pass .ic{background:var(--good-soft);color:var(--good)}
.check.flag .ic{background:var(--warn-soft);color:var(--warn)}
.check.block .ic{background:var(--bad-soft);color:var(--bad)}
.check.block{border-color:var(--bad)}
.summary-line{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.summary-line:last-child{border-bottom:0}

.trace{display:grid;gap:0}
.trace-node{display:grid;grid-template-columns:22px 1fr;gap:10px}
.trace-rail{display:flex;flex-direction:column;align-items:center}
.trace-dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);background:var(--surface);margin-top:5px}
.trace-dot.plot{border-color:var(--wood);background:var(--wood)}
.trace-line{flex:1;width:2px;background:var(--line);min-height:14px}
.trace-body{padding-bottom:14px;min-width:0}

.plot-shape{width:64px;height:64px;flex:none;border-radius:8px;background:var(--sunk)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.88rem;font-weight:600;z-index:80;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.empty{padding:20px;text-align:center;color:var(--muted);font-size:.9rem}
.two{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));align-items:start}
.doc-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.doc-row:last-child{border-bottom:0}
.formula{font-family:var(--f-mono);font-size:.8rem;background:var(--sunk);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
<style>

async function sha256(file){ const buf = await file.arrayBuffer(); const h = await crypto.subtle.digest('SHA-256', buf); return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join(''); }
function plotArea(p){
  if (p.coords.length < 3) return p.area;
  const lat0 = p.coords[0][0]*Math.PI/180;
  const pts = p.coords.map(([la,lo]) => [lo*Math.cos(lat0)*111320, la*110574]);
  let a = 0; for (let i=0;i<pts.length;i++){ const [x1,y1]=pts[i], [x2,y2]=pts[(i+1)%pts.length]; a += x1*y2 - x2*y1; }
  return r1(Math.abs(a)/2/10000);
}
function gstinValid(g){
  if (!/^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(g)) return false;
  const cs = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ'; let s = 0;
  for (let i=0;i<14;i++){ const p = cs.indexOf(g[i])*(i%2?2:1); s += Math.floor(p/36) + p%36; }
  return cs[(36 - s%36)%36] === g[14];

const ewbPortal = no => /^38100\d{7}$/.test(String(no).trim()) ? 'Verified' : 'Not found';

/* ---------- Register: claims across all cases ---------- */
function register(){
  const inv = {}, tp = {}, bilty = {};
  S.cases.forEach(c => c.docs.forEach(d => {
    if (d.kind==='trade'){ const k = invKey(d); (inv[k] ||= {no:d.invNo, seller:d.seller, buyer:d.buyer, species:d.species, form:d.form, total:d.invCft, ewbNo:d.ewbNo, claims:[]}).claims.push({case:c.id, doc:d.id, cft:d.cft}); if (d.biltyNo) (bilty[norm(d.biltyNo)] ||= new Set()).add(k); }
    if (d.kind==='felling'){ const k = d.tp.trim().toUpperCase(); (tp[k] ||= {no:d.tp, plot:d.plot, species:d.species, total:d.tpCft, claims:[]}).claims.push({case:c.id, doc:d.id, cft:d.cft}); }
  }));
  [...Object.values(inv), ...Object.values(tp)].forEach(r => { r.claimed = r1(r.claims.reduce((s,x)=>s+x.cft,0)); r.left = r1(r.total - r.claimed); });
  return {inv, tp, bilty};
}

/* ---------- The core check ---------- */
const norm = s => String(s).replace(/\s/g,'').toUpperCase();
function speciesOf(c){ return [...new Set(c.lines.map(l=>product(l.pid)?.species).filter(Boolean))]; }
function skuHistory(pid){ return S.cases.filter(c=>c.decl?.file).flatMap(c=>c.decl.items.filter(i=>i.pid===pid).map(i=>({case:c.id, cft:i.cft, date:c.date}))); }
function declCheck(c, out){
  const dcl = c.decl;
  if (!dcl || !dcl.file){ out.missing.push({doc:'decl', text:'Exporter declaration on letterhead (container numbers, goods shipped, cft per item, species and scientific name)'}); return; }
  if (!dcl.containers.length) out.missing.push({doc:'decl', text:'Container numbers in the exporter declaration'});
  dcl.containers.forEach(cn => { const other = S.cases.find(o => o.id!==c.id && o.decl?.file && o.decl.containers.some(x=>norm(x)===norm(cn)));
    if (other) out.checkIssues.push({doc:'decl', text:`Container ${cn} is also declared for ${other.id} (${other.expNo}).`, ask:`the correct container number for this shipment, or the stuffing report if both exports shared ${cn}`}); });
  c.lines.forEach(l => { const p = product(l.pid); const it = dcl.items.find(i=>i.pid===l.pid);
    if (!it) { out.checkIssues.push({doc:'decl', text:`${p.name} is on the export invoice but not in the declaration.`, ask:`a declaration that lists ${p.name}`}); return; }
    if (+it.qty !== +l.qty) out.checkIssues.push({doc:'decl', text:`Declaration shows ${fmt(it.qty,0)} × ${p.name}; the export invoice shows ${fmt(l.qty,0)}.`, ask:'a declaration with quantities matching the export invoice'});
    if (Math.abs(it.cft - p.cft) > 0.001){ const prev = skuHistory(p.id).filter(h=>h.case!==c.id).map(h=>`${h.case}: ${fmt(h.cft,2)}`);
      out.checkIssues.push({doc:'decl', sku:true, text:`${p.name}: declared ${fmt(it.cft,2)} cft per unit, but the agreed figure is ${fmt(p.cft,2)} cft${prev.length?` (earlier declarations: ${prev.join(', ')})`:''}.`, ask:`the reason the cft of ${p.name} changed, or a corrected declaration at ${fmt(p.cft,2)} cft`}); }
    if (it.species !== p.species || it.sci !== SPECIES[p.species]) out.checkIssues.push({doc:'decl', text:`${p.name}: declared ${it.species} (${it.sci}); expected ${p.species} (${SPECIES[p.species]}).`, ask:`the correct species and scientific name for ${p.name}`});
  });
}
function evaluate(c){
  const R = register();
  const species = speciesOf(c);
  const out = {species:[], numberIssues:[], checkIssues:[], missing:[], cautions:[], exported:0};
  const w = S.rules.exporterWastage/100;
  species.forEach(sp => {
    const maxY = S.rules.maxYield[sp]/100;
    const X = r1(c.lines.filter(l=>product(l.pid)?.species===sp).reduce((s,l)=>s+l.qty*product(l.pid).cft,0));
    const docs = c.docs.filter(d=>d.species===sp);
    const trades = docs.filter(d=>d.kind==='trade');
    const sum = arr => r1(arr.reduce((s,x)=>s+x,0));
    const sawnToExp = sum(trades.filter(d=>d.form==='Sawn' && d.buyer===c.exporter).map(d=>d.cft));
    const millSold = sum(trades.filter(d=>d.form==='Sawn' && isMill(d.seller)).map(d=>d.cft));
    const sawnOut = sum(docs.filter(d=>d.kind==='sawing').map(d=>d.outCft));
    const sawIn = sum(docs.filter(d=>d.kind==='sawing').map(d=>d.inCft));
    const logsToMill = sum(trades.filter(d=>d.form==='Logs' && isMill(d.buyer)).map(d=>d.cft));
    const felled = sum(docs.filter(d=>d.kind==='felling').map(d=>d.cft));
    const logsNeed = r1(X/maxY);
    const steps = [
      {label:'Exported (agreed cft per product)', have:X, need:null},
      {label:'Sawn wood bought by exporter', have:sawnToExp, need:X, doc:'invoices for the sawn wood the exporter bought, with e-way bills'},
      {label:'Sawn wood sold by saw mill', have:millSold, need:X, doc:'the saw mill\'s sales invoices for this sawn wood, with e-way bills'},
      {label:'Sawn output at saw mill', have:sawnOut, need:X, doc:'the saw mill\'s sawing record / production register'},
      {label:'Logs bought by saw mill', have:logsToMill, need:logsNeed, doc:'log purchase invoices into the saw mill, with e-way bills'},
      {label:'Logs felled (transit passes)', have:felled, need:logsNeed, doc:'transit passes and felling permissions'}
    ];
    steps.slice(1).forEach(s => { s.gap = r1(s.have - s.need); if (s.gap < -0.05) out.numberIssues.push({sp, text:`${s.label}: ${fmt(s.have)} cft documented, at least ${fmt(s.need)} cft needed.`, short:-s.gap, ask:s.doc}); });
    const extra = [];
    if (X > 0 && sawnToExp >= X - 0.05){ const expect = r1(X/(1-w)); const wst = (sawnToExp-X)/sawnToExp*100; const ok = sawnToExp >= expect - 0.05;
      extra.push({ok, warn:!ok, text:`Exporter wastage ${fmt(wst)}%: ${fmt(sawnToExp)} cft bought for ${fmt(X)} cft of finished products. At the usual ${S.rules.exporterWastage}% wastage, about ${fmt(expect)} cft would be needed.`});

    if (sawIn > 0){ const y = sawnOut/sawIn; extra.push({ok: y <= maxY + 1e-9, text:`Saw mill yield ${fmt(y*100)}% (${fmt(sawnOut)} sawn from ${fmt(sawIn)} cft logs); maximum ${S.rules.maxYield[sp]}%. Saw mill wastage is accepted.`});
      if (y > maxY + 1e-9) out.numberIssues.push({sp, text:`Saw mill record shows ${fmt(y*100)}% yield, above the ${S.rules.maxYield[sp]}% maximum. ${fmt(sawnOut)} cft sawn needs at least ${fmt(sawnOut/maxY)} cft of logs; the record shows ${fmt(sawIn)} cft.`, short:r1(sawnOut/maxY - sawIn), ask:'a corrected sawing record, or log purchase documents covering the extra logs'}); }
    if (millSold > sawnOut + 0.05){ extra.push({ok:false, text:`Saw mill sold ${fmt(millSold)} cft sawn but its records show ${fmt(sawnOut)} cft produced`}); out.numberIssues.push({sp, text:`Saw mill sales (${fmt(millSold)} cft) exceed its documented output (${fmt(sawnOut)} cft).`, short:r1(millSold-sawnOut), ask:'the saw mill\'s sawing record for the extra output'}); }
    else if (sawnOut) extra.push({ok:true, text:`Saw mill sold no more than it produced (${fmt(millSold)} of ${fmt(sawnOut)} cft)`});
    if (sawIn > logsToMill + 0.05){ extra.push({ok:false, text:`Saw mill sawed ${fmt(sawIn)} cft of logs but bought ${fmt(logsToMill)} cft`}); out.numberIssues.push({sp, text:`Saw mill sawed ${fmt(sawIn)} cft of logs but only ${fmt(logsToMill)} cft of log purchases are documented.`, short:r1(sawIn-logsToMill), ask:'log purchase invoices into the saw mill'}); }
    const sellers = [...new Set(trades.filter(d=>!isMill(d.seller)).map(d=>d.seller))];
    sellers.forEach(sid => {
      const role = party(sid)?.role;
      [...new Set(trades.filter(d=>d.seller===sid).map(d=>d.form))].forEach(f => {

        if (!ok) out.numberIssues.push({sp, text:`${pname(sid)} sold ${fmt(sold)} cft of ${f.toLowerCase()} but documents show only ${fmt(got)} cft ${verb}.`, short:r1(sold-got), ask: role==='Generator' ? `transit passes for ${pname(sid)}` : `purchase invoices for ${pname(sid)} (${sp} ${f.toLowerCase()})`});

    const label = docLabel(d);

  });
  declCheck(c, out);
  if (!c.expFiles.invoice) out.missing.push({doc:'export', text:'Export commercial invoice'});
  if (!c.expFiles.shipping) out.missing.push({doc:'export', text:'Shipping bill'});
  if (!c.docs.length) out.missing.push({doc:'chain', text:'Chain of documents (nothing uploaded yet)'});
  let status;
  if (c.sent) status = ['Sent to Europe office','neutral'];
  else if (out.numberIssues.length) status = ["Numbers don't justify",'bad'];
  else if (out.cautions.length && !c.caution) status = ['Caution: low wastage','warn'];
  else if (out.checkIssues.length) status = ['Document check issue','warn'];
  else if (out.missing.length) status = ['Documents missing','warn'];
  else status = ['Complete','good'];
  out.status = status; out.exported = r1(out.exported);
  return out;
}
function docLabel(d){
  if (d.kind==='trade') return `invoice ${d.invNo} (${pname(d.seller)} → ${pname(d.buyer)})`;
  if (d.kind==='felling') return `transit pass ${d.tp}`;
  return `sawing record ${fmtDate(d.date)} (${pname(d.mill)})`;
}

/* ---------- Request letter ---------- */
function requestText(c, ev){
  const ex = party(c.exporter);
  const lines = [];
  lines.push(`To: ${ex.name}`);
  lines.push(`Subject: Documents needed for EUDR file — export invoice ${c.expNo}`);
  lines.push('');
  lines.push(`Thank you for the documents for export invoice ${c.expNo} to ${c.buyer}. Based on your product data, this export uses ${fmt(ev.exported)} cft of wood. To complete the EUDR file, we need the following.`);
  let n = 1;
  if (ev.numberIssues.length){
    lines.push(''); lines.push('A. Volumes not yet covered by documents');
    lines.push(`(We have used the highest sawing yield allowed for each species and accepted the saw mill's wastage.)`);
    ev.numberIssues.forEach(i => { lines.push(`${n++}. ${i.sp}: ${i.text} Shortfall ${fmt(i.short)} cft. Please send ${i.ask}.`); });
  }
  if (ev.cautions.length && !c.caution){
    lines.push(''); lines.push('B. Please confirm');
    ev.cautions.forEach(i => lines.push(`${n++}. ${i.sp}: ${i.text} Please send ${i.ask}.`));
  }
  if (ev.checkIssues.length){
    lines.push(''); lines.push('C. Documents we could not confirm');
    ev.checkIssues.forEach(i => lines.push(`${n++}. ${i.text} Please send ${i.ask}.`));
  }
  if (ev.missing.length){
    lines.push(''); lines.push('D. Papers missing from the file');
    ev.missing.forEach(i => lines.push(`${n++}. ${i.text}`));
  }
  lines.push(''); lines.push('Please share these by reply. Once received, we will re-run the checks and confirm.');
  return lines.join('\n');
}

function knownNote(){
  const d = dd; if (d.kind!=='trade') return '';
  const known = register().inv[(d.f.invNo||'').trim().toUpperCase()+'|'+d.seller]; if (!known) return '';
  return `<div class="check flag"><span class="ic">i</span><span>Invoice ${esc(known.no)} is already in the register: ${fmt(known.total)} cft of ${known.species} ${known.form.toLowerCase()}, ${fmt(known.claimed)} claimed by ${known.claims.map(x=>x.case).join(', ')}. This case can claim up to <b>${fmt(known.left)} cft</b>.</span></div>`;
}
function wireDoc(){
  const d = dd;
  $$('[data-ddk]').forEach(b => b.onclick = () => { d.kind = b.dataset.ddk; d.f = {}; d.src = {}; d.files = {}; d.hashes = {}; renderDocSheet(); });
  $$('[data-dds]').forEach(s => s.onchange = () => { d[s.dataset.dds] = s.value; renderDocSheet(); });
  $$('[data-dd]').forEach(i => { i.oninput = () => { d.f[i.dataset.dd] = i.value; d.src[i.dataset.dd] = 'typed'; if (i.dataset.dd==='invNo' && $('#dd_known')) $('#dd_known').innerHTML = knownNote(); }; });
  $$('[data-ddfile]').forEach(i => i.onchange = async () => { const f = i.files[0]; if (!f) return; d.files[i.dataset.ddfile] = true; d.hashes[i.dataset.ddfile] = await sha256(f); renderDocSheet(); toast(`${f.name} attached and fingerprinted`); });
  $('#dd_read')?.addEventListener('click', () => { simulateRead(); renderDocSheet(); });
  $('#dd_dupe')?.addEventListener('click', () => { if (!d.seller) { d.seller = 'P-07'; } simulateRead(); d.f.ewbNo = '381004612984'; d.src.ewbNo = 'typed'; renderDocSheet(); });
  $('#dd_save').onclick = saveDoc;
}
function simulateRead(){
  const d = dd, c = caseById(ui.caseId); const rnd = n => String(Math.floor(Math.random()*10**n)).padStart(n,'0');
  const fill = (k,v) => { d.f[k] = v; d.src[k] = 'scan'; };
  if (d.kind==='trade'){
    const sp = speciesOf(c).includes(d.species) ? d.species : d.species;
    const ini = pname(d.seller).split(/\s+/).filter(w=>/^[A-Z]/.test(w)).map(w=>w[0]).join('').slice(0,3);
    const cft = r1(40 + Math.random()*60);
    fill('invNo', `${ini}/26-27/${rnd(3)}`); fill('invDate', today()); fill('invCft', String(cft)); fill('cft', String(cft));
    fill('ewbNo', '38100'+rnd(7)); fill('biltyNo', 'PR-'+(5900+Math.floor(Math.random()*99))); fill('vehicle', 'RJ19GD'+(1000+Math.floor(Math.random()*8999)));
    fill('kg', String(Math.round(cft*(d.form==='Logs'?27:21)*(0.96+Math.random()*0.08))));
  } else if (d.kind==='felling'){
    const cft = r1(80 + Math.random()*120); fill('tp', `TP/JDH/2026/${1300+Math.floor(Math.random()*400)}`); fill('date', today()); fill('tpCft', String(cft)); fill('cft', String(cft));
  } else {
    const inC = r1(60 + Math.random()*60); fill('date', today()); fill('inCft', String(inC)); fill('outCft', String(r1(inC*0.58)));
  }
}
function saveDoc(){
  const d = dd, c = caseById(ui.caseId); const f = d.f; const msg = t => { $('#dd_msg').innerHTML = `<div class="check block"><span class="ic">!</span><span>${t}</span></div>`; };
  const num = k => +f[k] > 0;
  const allHashes = Object.entries(S.hashes);
  for (const [slot,h] of Object.entries(d.hashes)) { const hit = allHashes.find(([,v])=>v.h===h); if (hit) return msg(`The file attached as ${slot} was already uploaded for ${esc(hit[1].where)}. The same scan can't back two documents.`); }
  let doc;
  if (d.kind==='trade'){
    if (!d.seller || !d.buyer || d.seller===d.buyer) return msg('Choose a seller and a different buyer.');
    if (!f.invNo || !f.invDate || !num('invCft') || !num('cft') || !f.ewbNo) { return msg('Invoice no., date, invoice cft, claimed cft and e-way bill no. are needed. Use "Read numbers from files" or type them.'); }
    const reg = register(); const key = f.invNo.trim().toUpperCase()+'|'+d.seller; const known = reg.inv[key];
    if (c.docs.some(x=>x.kind==='trade' && invKey(x)===key)) { return msg(`Invoice ${esc(f.invNo)} is already in this case.`); }
    const ewbOwner = Object.values(reg.inv).find(r => r.ewbNo===f.ewbNo.trim() && (r.no.toUpperCase()+'|'+r.seller)!==key);
    if (ewbOwner) { return msg(`E-way bill ${esc(f.ewbNo)} already belongs to invoice ${esc(ewbOwner.no)} from ${esc(pname(ewbOwner.seller))} (case ${ewbOwner.claims.map(x=>x.case).join(', ')}). One e-way bill can't cover two invoices.`); }
    if (known && (known.species!==d.species || known.form!==d.form)) return msg(`Invoice ${esc(known.no)} is already recorded as ${known.species} ${known.form.toLowerCase()}. The same invoice can't be used for ${d.species} ${d.form.toLowerCase()}.`);
    const total = known ? known.total : +f.invCft;
    const avail = known ? known.left : total;
    if (+f.cft > avail + 0.05) { return msg(`Only ${fmt(avail)} cft of this invoice is still unclaimed${known?` (others: ${known.claims.map(x=>`${x.case} ${fmt(x.cft)}`).join(', ')})`:''}.`); }
    doc = {id:'', kind:'trade', seller:d.seller, buyer:d.buyer, form:d.form, species:d.species, invNo:f.invNo.trim(), invDate:f.invDate, invCft:total, cft:r1(+f.cft), ewbNo:f.ewbNo.trim(), biltyNo:(f.biltyNo||'').trim(), vehicle:(f.vehicle||'').trim(), kg:+f.kg||0, files:Object.fromEntries(FILES.trade.map(([k])=>[k,!!d.files[k]])), irn:'No IRN'};
  } else if (d.kind==='felling'){
    if (!d.plot || !f.tp || !num('tpCft') || !num('cft')) { return msg('Choose a plot and enter the TP number, TP volume and claimed cft.'); }
    const reg = register(); const known = reg.tp[f.tp.trim().toUpperCase()];
    const total = known ? known.total : +f.tpCft; const avail = known ? known.left : total;
    if (+f.cft > avail + 0.05) { return msg(`Only ${fmt(avail)} cft of TP ${esc(f.tp)} is still unclaimed.`); }
    doc = {id:'', kind:'felling', plot:d.plot, species:d.species, tp:f.tp.trim(), tpCft:total, cft:r1(+f.cft), date:f.date||today(), files:Object.fromEntries(FILES.felling.map(([k])=>[k,!!d.files[k]]))};
  } else {
    if (!num('inCft') || !num('outCft')) { return msg('Enter logs in and sawn out.'); }
    if (+f.outCft > +f.inCft) { return msg('Sawn output cannot be more than logs in.'); }
    doc = {id:'', kind:'sawing', mill:d.mill, species:d.species, inCft:r1(+f.inCft), outCft:r1(+f.outCft), date:f.date||today(), files:{register:!!d.files.register}};
  }
  const nid = 'D-'+String(++S.seq.doc).padStart(2,'0'); doc.id = nid;
  Object.entries(d.hashes).forEach(([slot,h]) => S.hashes[nid+'|'+slot] = {h, where:`${slot} of ${docLabel(doc)}`});
  c.docs.push(doc); closeSheet(); render(); toast(`${nid} added · checks re-run`);
}

const CFT_M3 = 0.0283168;
function plotsOfCase(c){ return [...new Set(c.docs.filter(d=>d.kind==='felling').map(d=>d.plot))].map(plot).filter(Boolean); }
function ddsRows(c){
  return c.lines.map(l => { const p = product(l.pid); const it = c.decl?.items.find(i=>i.pid===l.pid);
    const fell = c.docs.filter(d=>d.kind==='felling' && d.species===p.species);
    const dates = fell.map(f=>f.date).sort();
    const chain = c.docs.filter(d=>d.kind==='trade' && d.species===p.species).sort((a,b)=>a.invDate.localeCompare(b.invDate)).map(d=>pname(d.seller)).concat([pname(c.exporter)]);
    return {case:c.id, expNo:c.expNo, date:c.date, buyer:c.buyer, exporter:pname(c.exporter), gstin:party(c.exporter).gstin, containers:(c.decl?.containers||[]).join('; '),
      hs:p.hs, desc:`${p.name} (${p.species.toLowerCase()} wood)`, qty:l.qty, kg:r1(l.qty*(it?.kg ?? p.kg)), m3:Math.round(l.qty*p.cft*CFT_M3*1000)/1000, cft:r1(l.qty*p.cft),
      sci:SPECIES[p.species], common:p.species, country:'IN',
      places:[...new Set(fell.map(f=>f.plot))].join('; '), from:dates[0]||'', to:dates.at(-1)||'', chain:[...new Set(chain)].join(' > ')};
  });
}

function reportGeo(list){
  const feats = []; const seen = new Set();
  list.forEach(c => plotsOfCase(c).forEach(p => { if (seen.has(p.id)) return; seen.add(p.id);
    feats.push({type:'Feature', geometry: p.coords.length<3 ? {type:'Point', coordinates:[p.coords[0][1],p.coords[0][0]]} : {type:'Polygon', coordinates:[[...p.coords,p.coords[0]].map(([la,lo])=>[lo,la])]},
      properties:{ProducerName:pname(p.gen), ProducerCountry:'IN', ProductionPlace:`${p.id} ${p.village}`, Area:plotArea(p)}});
  }));
  return JSON.stringify({type:'FeatureCollection', features:feats}, null, 2);
}

/* ---------- Parties & plots ---------- */
function shapeSVG(p, size=56){
  const pad = 9, w = size;
  if (p.coords.length < 3) return `<svg class="plot-shape" style="width:${w}px;height:${w}px" viewBox="0 0 ${w} ${w}" aria-hidden="true"><circle cx="${w/2}" cy="${w/2}" r="${w*0.28}" fill="none" stroke="var(--wood)" stroke-dasharray="3 3" opacity=".7"/><circle cx="${w/2}" cy="${w/2}" r="4" fill="var(--wood)"/></svg>`;
  const lats = p.coords.map(c=>c[0]), lngs = p.coords.map(c=>c[1]);
  const [a,b,c,d] = [Math.min(...lats),Math.max(...lats),Math.min(...lngs),Math.max(...lngs)];
  const k = Math.cos(a*Math.PI/180), span = Math.max(b-a,(d-c)*k)||1;
  const pts = p.coords.map(([la,lo]) => [pad+((lo-c)*k)/span*(w-2*pad), w-pad-(la-a)/span*(w-2*pad)]);
  return `<svg class="plot-shape" style="width:${w}px;height:${w}px" viewBox="0 0 ${w} ${w}" aria-hidden="true"><polygon points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="var(--wood)" fill-opacity=".22" stroke="var(--wood)" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}
function vParties(){
  return `
  <div class="view-head"><div><h2>Parties and plots</h2><p>Recorded from the documents exporters send. GSTIN and PAN are checked through a government-data API at about ₹1 a check; plots are checked on satellite imagery instead of photos.</p></div>
    <div class="row"><button class="btn" type="button" data-act="add-plot">Add plot</button><button class="btn primary" type="button" data-act="add-party">Add party</button></div></div>
  <section class="panel"><div class="panel-pad"><h3>Plots (${S.plots.length})</h3></div><div class="list">
    ${S.plots.map(p=>`<div class="li" style="align-items:center">${shapeSVG(p)}<div class="grow stack" style="gap:1px"><span><b class="mono">${p.id}</b> · ${esc(p.village)} · ${esc(pname(p.gen))}</span><span class="small muted">${fmt(plotArea(p))} ha · ${p.coords.length<3?'GPS point':p.coords.length+'-point polygon'} · EU 2020 forest map: ${esc(p.forest2020)}</span><button class="btn ghost small" type="button" data-plot="${p.id}" style="padding:0;justify-self:start">View satellite imagery</button></div>
      <div class="stack" style="justify-items:end">${pill(p.sat==='Pass'?'Satellite pass':p.sat==='Pending'?'Not checked':'Satellite '+p.sat.toLowerCase(), p.sat==='Pass'?'good':p.sat==='Fail'?'bad':'warn')}<span class="row" style="flex-wrap:nowrap"><select data-satsel="${p.id}" aria-label="Demo result for ${p.id}" style="font-size:.8rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:2px 4px"><option>Pass</option><option>Review</option><option>Fail</option></select><button class="btn small" type="button" data-satrun="${p.id}">Run check</button></span></div></div>`).join('')}
  </div></section>
  <section class="panel"><div class="panel-pad"><h3>Parties (${S.parties.length})</h3></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Role</th><th>GSTIN / PAN</th><th>Government checks</th></tr></thead><tbody>
    ${S.parties.map(p=>`<tr><td>${esc(p.name)}<br><span class="small muted">${esc(p.place)}</span></td><td>${p.role}</td><td class="mono small">${p.gstin?esc(p.gstin):'PAN '+esc(p.pan)}</td><td><div class="chips">${p.gstStatus==='Active'?'<span class="chip ok">GSTIN active</span>':p.gstStatus==='Unregistered'?'<span class="chip">No GSTIN</span>':`<span class="chip miss">GSTIN ${p.gstStatus.toLowerCase()}</span>`}<span class="chip ok">PAN valid</span>${p.gstin?'<span class="chip ok">PAN matches GSTIN</span>':''}</div></td></tr>`).join('')}
  </tbody></table></div></section>`;
}
function sheetAddParty(){
  openSheet('Add party', `
  <form class="form" id="partyForm">
    <div class="fields">
      <label class="f">Role<select id="pf_role">${ROLES.map(r=>`<option>${r}</option>`).join('')}</select></label>
      <label class="f">GSTIN<span class="row" style="flex-wrap:nowrap"><input id="pf_gstin" class="mono" maxlength="15" placeholder="08AAJFM6604Q1ZO" autocomplete="off" style="text-transform:uppercase"><button class="btn small" type="button" id="pf_fetch">Fetch</button></span>
        <span class="hint muted">Try 08AAJFM6604Q1ZO (active) or 08AABFK1190E1ZO (cancelled). Leave blank for an unregistered farmer.</span></label>
    </div>
    <div id="pf_result"></div>
    <div class="fields">
      <label class="f">Legal name<input id="pf_name" required></label>
      <label class="f">PAN<input id="pf_pan" class="mono" maxlength="10" style="text-transform:uppercase" required></label>
      <label class="f">Address<input id="pf_place" required></label>
    </div>
    <div class="row" style="justify-content:flex-end"><button class="btn primary" type="submit">Save party</button></div>
  </form>`);
  let gst = {status:'Unregistered'};
  $('#pf_fetch').onclick = () => {
    const g = $('#pf_gstin').value.trim().toUpperCase(); $('#pf_gstin').value = g; const box = $('#pf_result');
    if (!gstinValid(g)) { box.innerHTML = `<div class="check block"><span class="ic">!</span><span>That is not a valid GSTIN. Check the 15 characters; the last one is a check digit.</span></div>`; return; }
    const dupe = S.parties.find(p=>p.gstin===g); if (dupe) { box.innerHTML = `<div class="check block"><span class="ic">!</span><span>${esc(dupe.name)} is already recorded with this GSTIN.</span></div>`; return; }
    $('#pf_pan').value = g.slice(2,12);
    const hit = GST_REGISTRY[g];
    if (hit){ gst = hit; $('#pf_name').value = hit.legal; $('#pf_place').value = hit.place;
      box.innerHTML = `<div class="check ${hit.status==='Active'?'pass':'block'}"><span class="ic">${hit.status==='Active'?'✓':'!'}</span><span><b>${esc(hit.legal)}</b> · ${esc(hit.type)} · registered ${fmtDate(hit.reg)} · status <b>${hit.status}</b>${hit.status!=='Active'?'. Invoices from this party will be flagged.':''}<br><span class="muted small">Filled from GST records. PAN taken from the GSTIN.</span></span></div>`; }
    else { gst = {status:'Active'}; box.innerHTML = `<div class="check flag"><span class="ic">i</span><span>GSTIN format and check digit are valid. In the live app the GST portal fills the name and address; in this demo, type them in.</span></div>`; }
  };
  $('#partyForm').onsubmit = e => { e.preventDefault(); const g = $('#pf_gstin').value.trim().toUpperCase(); if (g && !gstinValid(g)) { toast('Fix the GSTIN or leave it blank'); return; }
    const p = {id:'P-'+String(++S.seq.party).padStart(2,'0'), role:$('#pf_role').value, name:$('#pf_name').value.trim(), gstin:g, pan:$('#pf_pan').value.trim().toUpperCase(), place:$('#pf_place').value.trim(), gstStatus:g?gst.status:'Unregistered'};
    S.parties.push(p); closeSheet(); render(); toast(`${p.name} added`); };
}
function sheetAddPlot(){
  openSheet('Add plot', `
  <form class="form" id="plotForm">
    <div class="fields">
      <label class="f">Generator<select id="pl_gen">${S.parties.filter(p=>p.role==='Generator').map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select></label>
      <label class="f">Village<input id="pl_vil" required></label>
      <label class="f">Declared area (ha)<input id="pl_area" type="number" min="0.01" step="0.01" required></label>
    </div>
    <label class="f">Coordinates, one "lat, lng" per line<textarea id="pl_coords" placeholder="26.3412, 73.1187" required></textarea><span class="hint muted">One line is a point (plots up to 4 ha). Three or more lines make a boundary polygon, which is required above 4 ha.</span></label>
    <div class="row" style="justify-content:flex-end"><button class="btn primary" type="submit">Save plot</button></div>
  </form>`);
  $('#plotForm').onsubmit = e => { e.preventDefault();
    const coords = $('#pl_coords').value.split('\n').map(l=>l.split(',').map(Number)).filter(a=>a.length===2&&a.every(Number.isFinite));
    if (!coords.length) { toast('Enter at least one coordinate pair'); return; }
    const p = {id:'PL-'+String(++S.seq.plot).padStart(2,'0'), gen:$('#pl_gen').value, village:$('#pl_vil').value.trim(), area:+$('#pl_area').value, coords, sat:'Pending', forest2020:'Not checked', loss:null};
    S.plots.push(p); closeSheet(); render(); toast(`${p.id} added · run the satellite check`); };
}
function satTile(p, year, lossFrac){
  let seed = [...(p.id+year)].reduce((a,ch)=>a*31+ch.charCodeAt(0)>>>0, 7);
  const rnd = () => (seed = (seed*1664525 + 1013904223)>>>0) / 4294967296;
  const W = 150, pad = 26;
  const lats = p.coords.map(c=>c[0]), lngs = p.coords.map(c=>c[1]);
  const [a,b,c,d] = [Math.min(...lats),Math.max(...lats),Math.min(...lngs),Math.max(...lngs)];
  const k = Math.cos(a*Math.PI/180), span = Math.max(b-a,(d-c)*k)||1;
  const pts = p.coords.length<3 ? null : p.coords.map(([la,lo]) => [pad+((lo-c)*k)/span*(W-2*pad), W-pad-(la-a)/span*(W-2*pad)]);
  const inside = (x,y) => { if (!pts) return Math.hypot(x-W/2,y-W/2) < 40; let r=false; for (let i=0,j=pts.length-1;i<pts.length;j=i++){ const [xi,yi]=pts[i],[xj,yj]=pts[j]; if ((yi>y)!==(yj>y) && x < (xj-xi)*(y-yi)/(yj-yi)+xi) r=!r; } return r; };
  let trees = '', fields = '';
  for (let i=0;i<7;i++) fields += `<rect x="${(rnd()*W).toFixed(0)}" y="${(rnd()*W).toFixed(0)}" width="${(30+rnd()*50).toFixed(0)}" height="${(20+rnd()*40).toFixed(0)}" fill="var(--wood)" opacity="${(0.06+rnd()*0.1).toFixed(2)}" transform="rotate(${(rnd()*20-10).toFixed(0)} ${W/2} ${W/2})"/>`;
  for (let i=0;i<140;i++){ const x = rnd()*W, y = rnd()*W, r = 1.6+rnd()*2.6; if (inside(x,y) && rnd() < lossFrac) continue; trees += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="var(--good)" opacity="${(0.45+rnd()*0.4).toFixed(2)}"/>`; }
  const outline = pts ? `<polygon points="${pts.map(q=>q.map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-dasharray="4 3"/>` : `<circle cx="${W/2}" cy="${W/2}" r="40" fill="none" stroke="var(--ink)" stroke-width="1.4" stroke-dasharray="4 3"/><circle cx="${W/2}" cy="${W/2}" r="3" fill="var(--ink)"/>`;
  return `<svg viewBox="0 0 ${W} ${W}" style="width:100%;max-width:200px;border-radius:8px;background:var(--wood-soft)" role="img" aria-label="Simulated satellite tile ${year}">${fields}${trees}${outline}</svg>`;
}
function sheetPlot(id){
  const p = plot(id);
  const lossNow = p.sat==='Fail' ? 0.7 : p.sat==='Review' ? 0.25 : 0.08;
  openSheet(`Plot ${p.id} · ${p.village}`, `
    <div class="stack"><b>${esc(pname(p.gen))} · ${fmt(plotArea(p))} ha · ${p.coords.length<3?'GPS point':'boundary polygon'}</b><span class="small muted">${p.coords.map(c=>`${c[0].toFixed(4)}, ${c[1].toFixed(4)}`).join(' · ')}</span></div>
    <div class="fieldset"><span class="fs-title">Satellite imagery instead of site photos</span>
      <div class="row" style="flex-wrap:nowrap;gap:12px;align-items:flex-start">
        <div class="stack" style="flex:1;min-width:0">${satTile(p,'2020',0)}<span class="small muted">Dec 2020 · Sentinel-2 · cut-off</span></div>
        <div class="stack" style="flex:1;min-width:0">${satTile(p,'2020',lossNow)}<span class="small muted">Latest · Sentinel-2</span></div>
      </div>
      <span class="small muted">Simulated tiles. The live app pulls free Sentinel-2 imagery for the plot boundary and compares it with the EU's 2020 forest-cover map and tree-cover-loss data.</span>
      <div class="summary-line"><span class="muted">EU forest map, 31 Dec 2020</span><span>${esc(p.forest2020)}</span></div>
      <div class="summary-line"><span class="muted">Tree-cover loss inside plot since 2020</span><span class="mono">${p.loss==null?'—':fmt(p.loss)+' ha'}</span></div>
      <div class="summary-line"><span class="muted">Result</span><span>${pill(p.sat==='Pass'?'Pass':p.sat==='Pending'?'Not checked':p.sat, p.sat==='Pass'?'good':p.sat==='Fail'?'bad':'warn')}</span></div>
    </div>`);
}
/* ---------- Rules ---------- */
function vRules(){
  const inp = (attr,v) => `<input type="number" step="0.5" min="1" max="100" value="${v}" ${attr} class="mono" style="width:80px;text-align:right;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--surface)">`;
  return `
  <div class="view-head"><div><h2>Rules</h2><p>The two numbers the volume check uses. Values here are examples; confirm them with saw mills and factories.</p></div></div>
  <div class="two">
    <section class="panel"><div class="panel-pad stack"><h3>Maximum sawing yield</h3><span class="small muted">Saw mill wastage is accepted. Logs needed = exported cft ÷ this yield.</span></div><div class="table-wrap"><table><thead><tr><th>Species</th><th class="r">Max yield, logs → sawn</th></tr></thead><tbody>
      ${Object.keys(SPECIES).map(s=>`<tr><td>${s} <i class="small muted">${SPECIES[s]}</i></td><td class="r">${inp(`data-yield="${s}" aria-label="Max yield ${s}"`, S.rules.maxYield[s])} %</td></tr>`).join('')}
    </tbody></table></div></section>
    <section class="panel"><div class="panel-pad stack"><h3>Usual exporter factory wastage</h3><span class="small muted">Furniture making normally wastes about this share of the wood bought. If an exporter's purchases leave less wastage than this, the case gets a caution: some wood may have come from undocumented sources. Wood needed = finished cft ÷ (1 − wastage).</span></div>
      <div class="panel-pad row"><label class="f" style="flex-direction:row;display:flex;align-items:center;gap:8px">About ${inp('data-wastage aria-label="Exporter wastage limit"', S.rules.exporterWastage)} %</label></div></section>
  </div>`;
}

/* ---------- Sheet ---------- */
function openSheet(title, html){
  const root = $('#sheetRoot'); const prev = root.querySelector('.sheet')?.scrollTop || 0; const same = root.dataset.title === title;
  root.dataset.title = title;
  root.innerHTML = `<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-head"><h2 style="font-size:1.1rem">${esc(title)}</h2><button class="x" type="button" data-close aria-label="Close">×</button></div><div class="sheet-body">${html}</div></div></div>`;
  if (same) root.querySelector('.sheet').scrollTop = prev;
}
function closeSheet(){ $('#sheetRoot').innerHTML = ''; delete $('#sheetRoot').dataset.title; }

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-case],[data-act],[data-cf],[data-close],[data-scrim],[data-plot],[data-satrun],#repCsv,#repGeo,#repSend');
  if (!t) return;
  if (t.dataset.scrim !== undefined && e.target !== t) return;
  if (t.dataset.close !== undefined || t.dataset.scrim !== undefined) { closeSheet(); return; }
  if (t.dataset.tab){ ui.tab = t.dataset.tab; ui.caseId = null; closeSheet(); render(); window.scrollTo(0,0); return; }
  if (t.dataset.case !== undefined){ ui.tab = 'cases'; ui.caseId = t.dataset.case || null; closeSheet(); render(); window.scrollTo(0,0); return; }
  if (t.dataset.cf){ ui.caseFilter = t.dataset.cf; render(); return; }
  if (t.dataset.plot){ sheetPlot(t.dataset.plot); return; }
  if (t.dataset.satrun){ const p = plot(t.dataset.satrun); p.sat = document.querySelector(`[data-satsel="${p.id}"]`).value; p.forest2020 = p.sat==='Fail' ? 'Forest' : p.sat==='Review' ? 'Partly forest' : 'Not forest (farm land)'; p.loss = p.sat==='Fail' ? r1(plotArea(p)*0.6) : p.sat==='Review' ? r1(plotArea(p)*0.1) : 0; render(); toast(`${p.id}: satellite ${p.sat.toLowerCase()} (demo)`); return; }
  if (t.id==='repCsv'){ copyOut(reportCSV(S.cases.filter(c=>!c.sent && evaluate(c).status[1]==='good')), 'CSV'); return; }
  if (t.id==='repGeo'){ copyOut(reportGeo(S.cases.filter(c=>!c.sent && evaluate(c).status[1]==='good')), 'GeoJSON'); return; }
  if (t.id==='repSend'){ const r = S.cases.filter(c=>!c.sent && evaluate(c).status[1]==='good'); r.forEach(c=>c.sent=today()); render(); toast(`${r.length} case${r.length===1?'':'s'} marked sent`); return; }
  if (t.dataset.act){ ({'new-case':sheetNewCase,'add-doc':sheetAddDoc,'request':sheetRequest,'add-party':sheetAddParty,'add-plot':sheetAddPlot})[t.dataset.act](); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.legfile && el.files.length){ const [did,f] = el.dataset.legfile.split('|'); const d = caseById(ui.caseId).docs.find(x=>x.id===did); d.files[f] = true; render(); toast('Attached · checks re-run'); }
  if (el.dataset.expfile && el.files.length){ caseById(ui.caseId).expFiles[el.dataset.expfile] = true; render(); toast('Attached · checks re-run'); }
  if (el.dataset.pcft){ const p = product(el.dataset.pcft); const v = +el.value; if (v>0 && v!==p.cft){ p.log.push({date:today(), from:p.cft, to:v}); p.cft = v; toast(`${p.name}: agreed cft changed to ${fmt(v,2)} (logged)`); } }
  if (el.dataset.declfile !== undefined && el.files.length){ const c = caseById(ui.caseId); c.decl = {file:true, containers:['TGHU '+String(1000000+Math.floor(Math.random()*8999999))], items:c.lines.map(l=>{ const p = product(l.pid); return {pid:l.pid, qty:l.qty, cft:p.cft, species:p.species, sci:SPECIES[p.species], kg:p.kg}; })}; render(); toast('Declaration read · checks re-run'); }
  if (el.dataset.dcft){ const c = caseById(ui.caseId); c.decl.items[+el.dataset.dcft].cft = +el.value; setTimeout(render, 180); }
  if (el.dataset.dcont !== undefined){ const c = caseById(ui.caseId); c.decl.containers = el.value.split(',').map(x=>x.trim()).filter(Boolean); setTimeout(render, 180); }
  if (el.dataset.wastage !== undefined){ const v = +el.value; if (v>=0 && v<=100){ S.rules.exporterWastage = v; toast(`Usual exporter wastage ${v}%`); } }
  if (el.dataset.yield){ const v = +el.value; if (v>0 && v<=100){ S.rules.maxYield[el.dataset.yield] = v; toast(`${el.dataset.yield} max yield ${v}%`); } }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'cautionForm'){ e.preventDefault(); const c = caseById(ui.caseId); c.caution = {reason:$('#cautionReason').value.trim(), date:today()}; render(); toast('Caution accepted · reason kept with the case'); return; }
  const ex = e.target.dataset?.addprod; if (!ex) return; e.preventDefault();
  const f = e.target; S.products.push({id:'PR-'+(++S.seq.product), exporter:ex, name:f.n.value.trim(), species:f.s.value, cft:+f.c.value, hs:f.h.value.trim(), kg:+f.k.value, log:[]}); render(); toast('Product added');
});
document.addEventListener('keydown', e => { if (e.key==='Escape' && $('#sheetRoot').innerHTML) closeSheet(); });
$('#resetBtn').addEventListener('click', () => { S = seed(); ui = {tab:'cases', caseId:null, caseFilter:'All'}; closeSheet(); render(); toast('Demo data reset'); });
render();
</script>
